<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgetMeNot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- header will remain static even when scrolling (for fullscreen) -->
    <header class="websiteHeader">
        <h1 class="websiteBrand">Forget Me Not!</h1>
        <p class="websiteTagline">What's in my fridge?</p>
    </header>

    <div class="pageLayout">
        <!-- items on left hand side will remain static even when scrolling (for fullscreen) -->
        <div class="leftHandSide">
            <section class="addItemMenu">
                <div class="panelHead">
                    <h2>Add Items</h2>
                </div>

                <form id="addItemForm">
                    <label for="itemName">Name:</label>
                    <input type="text" id="itemName" placeholder="e.g. Fresh Milk" required/>

                    <label for="itemLocation">Location:</label>
                    <select id="itemLocation">
                        <option>Fridge</option>
                        <option>Freezer</option>
                        <option>Pantry</option>
                    </select>

                    <label for="itemType">Type:</label>
                    <select id="itemType">
                        <option>Dairy</option>
                        <option>Meat</option>
                        <option>Fish</option>
                        <option>Beer</option>
                        <option>Drinks</option>
                        <option>Vegetable</option>
                        <option>Noodles</option>
                        <option>Grains</option>
                        <option>Sauces</option>
                        <option>Others</option>
                    </select>
                    
                    <label for="itemStock">Quantity</label>
                    <input type="number" id="itemStock" min="0" step="1" value="1"/>

                    <label for="itemPrice">Price each (RM):</label>
                    <input type="number" id="itemPrice" min="0" step="0.01" placeholder="0.00"/>

                    <button type="submit">Add Item</button>
                </form>

            </section>

            <!-- can click button to generate 3 different image of a person thinking -->
            <section class="imageMenu">

            </section>
        </div>

        <main class="rightHandSide">
            <div class="filteringBar">
                <!-- to filter between All selection, Fridge, Freezer, and Pantry -->
                <div id="tabs">

                </div>

                <!-- make a dropdown menu to filter the selection for the type ic Dairy, Veges, Beer, Sodas, Meat, etc. -->
                <div id="filter"> 

                </div>
            </div>

            <div id="itemGrid" class="itemCards">

            </div>
    
        </main>
    </div>

    <!-- small footer to trademark my work (should also be visible at all times during fullscreen) -->
    <footer class="websiteFooter">
        <p>I hope I don't forget anything...</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
