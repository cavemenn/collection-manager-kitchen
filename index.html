<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgetMeNot</title>

    <link rel="icon" href="images/favicon-thinking.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- header will remain static even when scrolling (for fullscreen) -->
    <header class="websiteHeader">
        <h1 class="websiteBrand">Forget Me Not!</h1>
        <p class="websiteTagline">What's in my kitchen?</p>
    </header>

    <div class="pageLayout">
        <!-- items on left hand side will remain static even when scrolling (for fullscreen) -->
        <div class="leftHandSide">
            <section class="addItemMenu">
                <div class="panelHead">
                    <h2>Add Items</h2>
                </div>

                <form id="addItemForm">
                    <label for="itemName">
                        Name:
                        <input type="text" id="itemName" placeholder="e.g. Fresh Milk" required/>
                    </label>

                    <div class="nextRow">
                        <label for="itemLocation">
                            Location:
                            <select id="itemLocation">
                                <option>Fridge</option>
                                <option>Freezer</option>
                                <option>Pantry</option>
                            </select>
                        </label>

                        <label for="itemType">
                            Type:
                            <select id="itemType">
                                <option>Dairy</option>
                                <option>Meat</option>
                                <option>Fish</option>
                                <option>Beer</option>
                                <option>Drinks</option>
                                <option>Vegetable</option>
                                <option>Noodles</option>
                                <option>Grains</option>
                                <option>Sauces</option>
                                <option>Others</option>
                            </select>
                        </label>
                    </div>
                    
                    <div class="nextRow">
                        <label for="itemStock">Quantity
                            <input type="number" id="itemStock" min="0" step="1" value="1"/>
                        </label>

                        <label for="itemPrice">Price each (RM):
                            <input type="number" id="itemPrice" min="0" step="0.01" placeholder="0.00"/>
                        </label>
                    </div>

                    <label for="itemRating">
                        Wife Approval Rating:
                        <select id="itemRating">
                            <option value="5">★★★★★</option>
                            <option value="4">★★★★☆</option>
                            <option value="3">★★★☆☆</option>
                            <option value="2">★★☆☆☆</option>
                            <option value="1">★☆☆☆☆</option>
                        </select>
                    </label>

                    <label for="itemImage">
                        Photo:
                        <input type="file" id="itemImage" accept="image/*"/>
                    </label>

                    <button type="submit" class="btn btn-primary">Add Item</button>
                    <p id="addMessage"></p>
                </form>

            </section>

            <!-- can click button to generate 3 different image of a person thinking -->
            <section class="imageMenu">
                <img id="thinkImg" src="images/think1.jpeg" alt="Thinking meme">
                <button id="thinkBtn" type="button">Click to think</button>
            </section>
        </div>

        <main class="rightHandSide">
            <div class="filteringBar">
                <!-- to filter between All selection, Fridge, Freezer, and Pantry -->
                <div id="tabs">

                </div>

                <!-- make a dropdown menu to filter the selection for the type ic Dairy, Veges, Beer, Sodas, Meat, etc. -->
                <div id="filter">
                    Filter:
                </div>
            </div>

            <div id="itemGrid" class="itemCards">

            </div>
    
        </main>
    </div>

    <!-- small footer to trademark my work (should also be visible at all times during fullscreen) -->
    <footer class="websiteFooter">
        <p>I hope I don't forget anything...</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
